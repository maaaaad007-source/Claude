name: CI

# Push and pull request only. The weekly run lives in weekly.yml, which also
# commits a status report — keeping the schedule from being auto-disabled.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # Installing the real requirements, not just the test deps, so a
        # broken or unresolvable requirements.txt fails here rather than on
        # the next deploy.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: python -m pytest tests -q

      - name: Check the app module imports
        # The suite never imports app.py, since it needs a Streamlit runtime.
        # Compiling it catches syntax errors that tests would sail past.
        run: python -m compileall -q app.py executive_finder
